name: Keep OMNI App Alive

on:
  schedule:
    # Executa a cada 2 horas, no minuto 0.
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  ping-streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit health endpoint
        run: |
          curl --fail --silent --show-error --location \
            --connect-timeout 15 \
            --max-time 60 \
            https://acompanhamentoomni.streamlit.app/_stcore/health
