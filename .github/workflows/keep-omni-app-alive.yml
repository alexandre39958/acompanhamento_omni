name: Keep OMNI App Alive

on:
  schedule:
    # Executa a cada 2 horas, no minuto 0.
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  ping-streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit health endpoint
        run: |
          status_code=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            --connect-timeout 15 \
            --max-time 60 \
            --max-redirs 0 \
            https://acompanhamentoomni.streamlit.app/_stcore/health)

          case "$status_code" in
            2??|3??)
              echo "Streamlit respondeu com HTTP $status_code."
              ;;
            *)
              echo "Streamlit respondeu com HTTP $status_code."
              exit 1
              ;;
          esac
