name: Keep OMNI App Alive

on:
  schedule:
    # Executa a cada 2 horas, no minuto 0.
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  open-streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install browser automation
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Open Streamlit app in a browser
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });

            try {
              await page.goto('https://acompanhamentoomni.streamlit.app/', {
                waitUntil: 'domcontentloaded',
                timeout: 90000,
              });
              await page.waitForTimeout(30000);
              console.log(`Streamlit aberto: ${await page.title()} (${page.url()})`);
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          EOF
